[package]
name = "graycart-n64"
version = "0.0.1"
edition = "2021"
description = "Graycart Nintendo 64 emulator (library-first core + EdgeWalker Vulkan compute LLE RDP roadmap)"
license = "MIT"
repository = "https://github.com/graycart/graycart-n64"
readme = "README.md"
keywords = ["emulator", "n64", "nintendo-64", "mips", "vr4300"]
categories = ["emulators"]

[lib]
name = "graycart_n64"
path = "src/lib.rs"

[[bin]]
name = "graycart-n64"
path = "src/main.rs"

[features]
# Default mode is strictly hardware-faithful LLE with zero GUI dependencies.
default = []
# Explicit, opt-in HLE paths (never enabled by default; always labeled).
rsp-hle = []
rdp-hle = []
# Opt-in EdgeWalker compute device (M6). Default features stay GPU-free.
# wgpu is the compute API (pure Rust, no C++ FFI). pollster blocks adapter
# and device requests. Vulkan is preferred; DX12, Metal, and WebGPU are
# fallbacks inside that crate. No direct Vulkan-loader dependency.
vulkan-rdp = ["dep:wgpu", "dep:pollster"]

[dependencies]
# Whole-machine state is serializable from M0 for deterministic savestates/rewind/replay.
serde = { version = "1", features = ["derive"] }
# Pinned to the latest 24.x line (Windows Vulkan + DX12). Not in the default build.
wgpu = { version = "24.0.5", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
serde_json = "1"
